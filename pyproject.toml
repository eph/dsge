[build-system]
requires = ["setuptools>=68", "wheel", "numpy", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dsge"
dynamic = ["version"]
description = "A simple Python package for DSGE models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ed Herbst", email = "ed.herbst@gmail.com" },
]
keywords = ["dsge", "econometrics", "macroeconomics", "models"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",	   
  "pandas",
  "scipy",
  "sympy",
  "pyyaml",
  "numba",
  "lark",
  "cerberus",
]

[project.optional-dependencies]
test = [
  "pytest",
  "matplotlib",
]
progress = [
  "rich",
]
slurm = [
  "submitit",
]
codegen = [
  # Fortress is hosted on GitHub and provides `fortress.make_smc` used by codegen.
  # For local development, prefer installing your checkout separately (e.g. `uv pip install -e ../fortress`).
  "fortress @ git+https://github.com/eph/fortress.git@7fffbcfb037163295f12071d318455fa5651a2a1",
]

[tool.setuptools]
packages = { find = { include = ["dsge*"], exclude = ["build*", "dist*", "*.egg-info*"] } }
include-package-data = true

[tool.setuptools.package-data]
dsge = [
  "examples/*/*",
  "schema/*",
  "linalg/*",
  "templates/*",
  "prior.txt",
]

[tool.setuptools_scm]
# Defaults are fine; uncomment below for explicit schemes.
# version_scheme = "guess-next-dev"
# local_scheme = "node-and-date"

# uv-specific niceties
[dependency-groups]
build = [
  "setuptools>=68,<81",
  "wheel==0.45.1",
  "setuptools-scm[toml]==8.3.1",
]
dev = [
  "coverage-badge==1.1.2",
  # coverage-badge 1.1.2 imports pkg_resources, absent from newer setuptools.
  "setuptools<81",
  "pytest",
  "pytest-cov",
  "mypy",
  "ruff",
  "mkdocs>=1.5",
  "mkdocs-material",
  "mkdocs-macros-plugin",
  "mkdocstrings[python]",
  "importlib-resources; python_version < '3.9'",
  "matplotlib",
]

[tool.uv]
default-groups = ["dev"]
